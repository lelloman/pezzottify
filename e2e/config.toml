db_dir = "/data/db"
media_path = "/data/media"
port = 3001
metrics_port = 9091
logging_level = "path"
content_cache_age_sec = 60
frontend_dir_path = "/app/web"
secure_session_cookies = false # E2E is intentionally served over plain HTTP.
session_cookie_max_age_secs = 604800
# The suite deliberately creates many independent sessions from one Docker peer.
login_rate_limit_per_minute = 1000
login_rate_limit_per_hour = 1000
event_retention_days = 30

[oidc]
provider_url = "http://mock-oidc:8080"
client_id = "pezzottify-e2e"
client_secret = "e2e-secret"
redirect_uri = "http://pezzottify-server:3001/v1/auth/callback"
scopes = ["openid", "profile", "email"]
disable_password_auth = false

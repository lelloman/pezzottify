# Development docker-compose

services:
  pezzottify-server:
    # Allow the application its full 30-second shutdown budget.
    stop_grace_period: 35s
    build:
      context: .
      dockerfile: pezzottify-server/Dockerfile
      additional_contexts:
        simple-server-source: ${SIMPLE_SERVER_CONTEXT:-../simple-server}
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-0}
        COMMIT_COUNT: ${COMMIT_COUNT:-0}
    ports:
      - "3001:3001"
    volumes:
      - ./dev-data:/data/db
      - ./dev-data:/data/media
      - ./pezzottify-server/config.toml:/etc/pezzottify/config.toml:ro
    environment:
      - LOG_LEVEL=debug
    command: ["pezzottify-server", "--config", "/etc/pezzottify/config.toml"]

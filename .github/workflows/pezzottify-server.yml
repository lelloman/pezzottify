name: Pezzottify Server CI

on:
  pull_request:
    paths:
      - 'pezzottify-server/**'
      - 'simple-server.rev'
      - 'scripts/checkout-simple-server.sh'
      - 'e2e/**'
      - 'web/**'
      - '.github/workflows/pezzottify-server.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pezzottify-server

    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned simple-server dependency
        run: bash scripts/checkout-simple-server.sh
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit locked dependencies
        run: cargo audit

  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pezzottify-server

    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned simple-server dependency
        run: bash scripts/checkout-simple-server.sh
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pezzottify-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('pezzottify-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check database execution boundaries
        run: bash scripts/check-db-boundaries.sh

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --features fast

      - name: Build release
        run: cargo build --release

  backend-e2e:
    name: Backend Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned simple-server dependency
        run: bash scripts/checkout-simple-server.sh

      - name: Run server and web E2E tests
        run: ./e2e/run.sh tests -m "not android"

name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'paravoid.rev'
      - 'scripts/checkout-paravoid.sh'
      - 'simple-android-assistant.rev'
      - 'scripts/checkout-simple-android-assistant.sh'
      - 'androidoscopy.rev'
      - 'scripts/prepare-androidoscopy.sh'
      - '.github/workflows/android.yml'

jobs:
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    # The complete Paravoid packaging step shrinks the payload with R8, which took the
    # job past 30 minutes.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned Paravoid dependency
        run: bash scripts/checkout-paravoid.sh
        working-directory: .

      - name: Check out the pinned assistant dependency
        run: bash scripts/checkout-simple-android-assistant.sh
        working-directory: .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Rust toolchain for the assistant JNI library
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install assistant native build tools
        run: |
          sdkmanager "platforms;android-36" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Prepare pinned Androidoscopy artifacts
        run: bash scripts/prepare-androidoscopy.sh
        working-directory: .

      - name: Build and test
        # D8 merges share the Gradle daemon heap. Avoid concurrent app merges
        # and give the complete multi-variant build more than the 2 GiB default.
        run: |
          ./gradlew --no-parallel --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            testDebugUnitTest \
            :app:testNormalPhoneDebugUnitTest :app:testParavoidAndroidPhoneDebugUnitTest \
            :app:compileNormalPhoneReleaseKotlin :app:assembleNormalPhoneDebug \
            :app:assembleParavoidAndroidPhoneDebug :player-app:assembleDebug :player-app:assembleRelease

      - name: Lint downstream modules and app variants
        # Runtime-library lint lacks the plugin-generated shell permissions and API floor.
        # Run after compilation: lint can otherwise race KAPT-generated variant sources.
        run: |
          ./gradlew --no-parallel --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            :domain:lintDebug :ui:lintDebug :remoteapi:lintDebug :localdata:lintDebug \
            :debuginterface:lintDebug :player:lintDebug :logger:lintDebug \
            :equalizer:lintDebug :theme:lintDebug :player-app:lintDebug \
            :app:lintNormalPhoneDebug :app:lintParavoidAndroidPhoneDebug

      - name: Verify normal and Paravoid APK packaging
        run: python3 check-paravoid.py

      - name: Prepare disposable complete-payload signing keys
        run: |
          python3 -m pip install cryptography
          python3 ../../paravoid-android/packaging-tests/prepare-keys.py \
            --application-id com.lelloman.pezzottify.android.paravoid \
            --output "$RUNNER_TEMP/paravoid-keys"

      - name: Build and inspect complete Paravoid packaging
        run: |
          ./gradlew --no-parallel --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            :app:assembleParavoidAndroidPhoneDebug \
            -PparavoidComplete=true \
            -PparavoidTrustPolicy="$RUNNER_TEMP/paravoid-keys/trust.json" \
            -PparavoidReleaseKey="$RUNNER_TEMP/paravoid-keys/release.der"
          python3 check-paravoid-complete.py
          python3 check-paravoid-services.py app/build/outputs/paravoid/paravoidAndroidPhoneDebug
